<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Plateforme Animaux</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="auth-container">
        <div class="auth-left">
            <div class="overlay"></div>
            <div class="left-content">
                <h1>Bienvenue 🐾</h1>
                <p>
                    Rejoignez notre plateforme de garde et d’adoption d’animaux.
                    Créez votre compte pour trouver un compagnon ou proposer vos services.
                </p>
            </div>
        </div>

        <div class="auth-right">
            <div class="form-box">
                <h2>Créer un compte</h2>
                <p class="subtitle">Inscrivez-vous pour commencer votre aventure avec nos animaux.</p>

                <form action="register.php" method="POST" class="auth-form">
                    <div class="form-row">
                        <div class="input-group">
                            <label for="nom">Nom</label>
                            <input type="text" id="nom" name="nom" placeholder="Votre nom" required>
                        </div>

                        <div class="input-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="Votre email" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="input-group">
                            <label for="Pays">Pays</label>
                            <input type="text" id="Pays" name="Pays" placeholder="Votre pays" required>
                        </div>

                        <div class="input-group">
                            <label for="Ville">Ville</label>
                            <input type="text" id="Ville" name="Ville" placeholder="Votre ville" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="input-group">
                            <label for="num_tel">Téléphone</label>
                            <input type="text" id="num_tel" name="num_tel" placeholder="Votre numéro" required>
                        </div>

                        <div class="input-group">
                            <label for="mdp">Mot de passe</label>
                            <input type="password" id="mdp" name="mdp" placeholder="Votre mot de passe" required>
                        </div>
                    </div>

                    <div class="input-group full-width">
                        <label for="adresse">Adresse</label>
                        <textarea id="adresse" name="adresse" placeholder="Votre adresse complète" required></textarea>
                    </div>

                    <button type="submit" class="btn-primary">S'inscrire</button>

                    <p class="switch-link">
                        Déjà un compte ? <a href="login.html">Se connecter</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

</body>

</html>
