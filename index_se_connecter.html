<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace de Connexion</title>
    <link rel="stylesheet" href="style_se_connecter.css">
</head>
<body>
    <div class="container">
        <div class="login-form" id="loginForm">
            <h2>Connexion</h2>
            <form action="#" method="post">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="input-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn">Se connecter</button>
            </form>
            <a href="#" id="forgotPasswordLink">Mot de passe oublié ?</a>
        </div>
        <div class="forgot-password-form" id="forgotForm" style="display: none;">
            <h2>Réinitialiser le mot de passe</h2>
            <form action="#" method="post">
                <div class="input-group">
                    <label for="resetEmail">Email</label>
                    <input type="email" id="resetEmail" name="resetEmail" required>
                </div>
                <button type="submit" class="btn">Envoyer le lien de réinitialisation</button>
            </form>
            <a href="#" id="backToLoginLink">Retour à la connexion</a>
        </div>
    </div>
    <script>
        document.getElementById('forgotPasswordLink').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('forgotForm').style.display = 'block';
        });
        document.getElementById('backToLoginLink').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('forgotForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
        });
    </script>
</body>
</html>
